<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <!-- Lime glow — top left corner -->
  <ellipse cx="0" cy="0" rx="500" ry="400" fill="url(#g-lime-tl)" opacity="0.7"/>
  <!-- Violet glow — bottom right -->
  <ellipse cx="1440" cy="900" rx="520" ry="380" fill="url(#g-violet-br)" opacity="0.6"/>
  <!-- Faint lime breath — center right -->
  <ellipse cx="1200" cy="300" rx="300" ry="220" fill="url(#g-lime-cr)" opacity="0.25"/>

  <!-- Horizontal lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
  </g>
  <!-- Vertical lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="180" y1="0" x2="180" y2="900"/>
    <line x1="360" y1="0" x2="360" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="1080" y1="0" x2="1080" y2="900"/>
    <line x1="1260" y1="0" x2="1260" y2="900"/>
  </g>

  <!-- Accent dots -->
  <circle cx="180" cy="150" r="2" fill="#9CA3AF" opacity="0.35"/>
  <circle cx="360" cy="300" r="1.5" fill="#9CA3AF" opacity="0.2"/>
  <circle cx="1080" cy="600" r="2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="1260" cy="150" r="1.5" fill="#a78bfa" opacity="0.2"/>
  <circle cx="720" cy="750" r="2" fill="#9CA3AF" opacity="0.15"/>

  <defs>
    <radialGradient id="g-lime-tl" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-violet-br" cx="100%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-lime-cr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
